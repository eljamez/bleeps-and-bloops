# Copy to the project root as orca.project.yaml and commit it.
#
# Orca does not parse this file. scripts/bleeps does, and the setup hook
# calls that script. These keys are Bleeps script inputs, not Orca keys.
#
# One flat line per key: key: value
# A # starts a comment. The value is the rest of the line after the first colon.
#
# install     runs on worktree setup
# test        bleeps test, and scripts/orca-verify
# typecheck   bleeps typecheck, and scripts/orca-verify
# health_url  read by bleeps health. The check itself is not implemented yet.
# preview     recorded for later. bleeps preview does not run it yet.

install: npm ci
test: npm test
# Optional layers. When any of these is set, bleeps test runs them
# instead of the single test command.
# test_unit: npm run test:unit
# test_integration: npm run test:integration
# test_e2e: npm run test:e2e
typecheck: npm run typecheck
health_url: https://example.invalid/health
preview: npm run dev
# proactive defaults to on when this key is omitted. off skips the scout.
proactive: on
# Where Orca runs. local (default), cloud, or home.
# GitHub Actions is not a host. See docs/where-it-runs.md.
host: local
# runtime is issue-command (default) or bots. bots is optional.
# issue-command is Orca's issueCommand prompt. bots runs the crew as Orca
# bots in one group. Echo stays a fresh worker. See docs/bots.md.
runtime: issue-command
# chore_lane is off unless you opt in. on lets the workflow merge phase 1.
# Phase 1 is deps-patch and docs-drift. lint-format and site-sync stay off
# until you add them to chore_lane_classes. See docs/chore-lane-setup.md.
chore_lane: off
chore_lane_classes: deps-patch,docs-drift
# Ping's outside reviewer. none, coderabbit, or copilot. none installs nothing.
review_external: none
# Release-notes bot. off leaves Zap out of the group.
zap: off
scout_cap: 2
scout_schedule: daily
scout_time: "09:00"
scout_scans: tests, ci, lint, advisories, debt, friction, coverage
# scout_provider overrides Chip's provider. The default is Chip's row.
# scout_provider: claude
# router is off unless you opt in. jev asks a local proxy. The key is an
# environment variable name. jev_url is the proxy, not a secret.
# router: off
# jev_key_env: JEV_API_KEY
# jev_url: http://127.0.0.1:4000
# One field overrides that role. Omitted fields keep the factory table.
# beep_provider: claude
# beep_model: opus
# beep_tier: frontier
# buzz_provider: claude
# buzz_model: sonnet
# buzz_tier: balanced
# blip_provider: claude
# blip_model: sonnet
# blip_tier: balanced
# echo_provider: claude
# echo_model: opus
# echo_tier: frontier
# chip_provider: claude
# chip_model: haiku
# chip_tier: fast
# bloops_provider: claude
# bloops_model: sonnet
# bloops_tier: balanced
# ping_provider: claude
# ping_model: sonnet
# ping_tier: balanced
# boop_provider: claude
# boop_model: sonnet
# boop_tier: balanced
# zap_provider: claude
# zap_model: sonnet
# zap_tier: balanced
# error_tracking: a command that prints findings. Unset means that scan is skipped.
# fix_rounds: how many times a red suite goes back to be fixed in the same
# run. Default 2. The next red escalates to the owner. Integer 0-20.
# fix_rounds: 2
#
# Tickets. GitHub is required for every project (code, pull requests, CI).
# ticket_sources lists where the work items come from. Omitted means github.
# Keys that end in _env are environment variable names. Never put a token here.
# Docs: docs/tickets.md. Check: python3 scripts/check-ticket-sources
ticket_sources: github
# github_token_env: GH_TOKEN
# github_repo: owner/name
# github_project_owner: owner
# github_project_number: 1
# jira_base_url: https://example.atlassian.net
# jira_email_env: JIRA_EMAIL
# jira_token_env: JIRA_API_TOKEN
# jira_project: PROJ
# discord_token_env: DISCORD_BOT_TOKEN
# discord_channel_id: "123"
# discord_guild_id: "456"
# linear_api_key_env: LINEAR_API_KEY
# linear_team: ENG
