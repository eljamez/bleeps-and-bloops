# Bleeps factory config. Orca reads this file from the repository root.
#
# Decision: docs/decisions/0007-bleeps-is-built-for-orca.md
# How to run it: docs/where-it-runs.md
# host in orca.project.yaml picks the machine. Default local.
# docs/decisions/0014-where-it-runs.md
#
# Parser, pinned so we do not invent keys:
# https://github.com/stablyai/orca/blob/aa736b6650fd13a0256a7ba0b3b1c7741fb933ee/src/shared/orca-yaml.ts
#
# Keys that parser keeps:
#   scripts.setup              shell, after a worktree is created
#   scripts.archive            shell, before a worktree is archived
#   setupAgentStartupPolicy    start-immediately | wait-for-setup
#   issueCommand               prompt, not a shell script
#   defaultTabs                terminal tabs for a new worktree
#   environmentRecipes         ephemeral VM recipes
#   worktree.sharedDirectories gitignored directories shared across worktrees
#
# Anything else is dropped, except `providers`. Orca drops that key too.
# scripts/providers reads it. A project overrides one field in
# orca.project.yaml. See docs/decisions/0015-role-providers.md.
# There is no verification key and no merge key. scripts/orca-verify runs the
# checks. A required GitHub check is what can block a pull request.
# Conditional hooks, which this file cannot express:
# https://github.com/stablyai/orca/issues/6917
#
# Setup environment from Orca (src/main/workspace-hooks/setup-hook-env-vars.ts
# at the same commit): ORCA_ROOT_PATH, ORCA_WORKTREE_PATH, ORCA_WORKSPACE_NAME,
# and ORCA_WORKTREE_ID / ORCA_WORKSPACE_ID when the workspace id exists.
# CLI creates run this hook with --run-hooks, or when the repo setup policy says run.
#
# issueCommand placeholders Orca substitutes: {{issue}} and {{artifact_url}}.
# A file at .orca/issue-command replaces this prompt for that checkout.
#
# Per-project install, test, typecheck, the scout, and ticket sources are not
# Orca keys. The setup script reads orca.project.yaml. Example:
# examples/orca.project.yaml. Ticket sources (GitHub, GitHub Projects, Jira,
# Discord, Linear) are named there. Secrets are env var names, never values.
# scripts/intake is the one path into kick-off. See docs/tickets.md.
#
# The scout is an Orca automation (orca automations create), not a key in
# this file. Orca's parser has no schedule field. See
# docs/decisions/0008-bleeps-is-proactive.md and scripts/bleeps-scout.

# The agent terminal waits until setup exits, so it starts with dependencies installed.
setupAgentStartupPolicy: wait-for-setup

scripts:
  # archive is omitted. There is nothing to clean up, and an empty command
  # would still be a hook Orca asks you to trust.
  setup: |
    set -eu
    # Follow one symlink. A project links this file; the scripts sit beside the real one.
    # ponytail: one level, no nested links. Upgrade path: realpath or readlink -f.
    yaml="orca.yaml"
    if [ -L "$yaml" ]; then
      target=$(readlink "$yaml") || exit 1
      case "$target" in
        /*) ;;
        *) target="$(pwd)/$target" ;;
      esac
    else
      target="$(pwd)/$yaml"
    fi
    factory=$(CDPATH= cd -- "$(dirname -- "$target")" && pwd)
    cd "${ORCA_WORKTREE_PATH:-.}"
    exec "$factory/scripts/orca-setup"

# Crew named by issueCommand, because orca.yaml has no agent-role key:
# Beep plans, Buzz implements, Blip tests, Echo verifies, Chip scouts, Bloops merges.
# See docs/decisions/0010-bleeps-runs-the-crew-bloops-reflects.md
# and docs/decisions/0011-scripts-first.md.

issueCommand: |
  You are Bleeps, the orchestrator, on issue {{issue}} ({{artifact_url}}).
  Run the crew. Do not look for a Claude plugin. Do not do their jobs yourself.

  If orca.yaml is a symlink, the Bleeps docs and scripts are in the directory
  of the real file. Otherwise they are in this worktree. Call that directory
  the factory.

  Work only in this worktree. Open pull requests against develop. Do not push
  to main, and do not open a pull request against main.

  1. Beep plans. If the issue body contains a Source-Id line, Beep runs
     <factory>/scripts/intake fetch with that source, that id, a slug, and
     --issue {{issue}}. That calls scripts/kick-off and fills ticket.md.
     Otherwise Beep runs <factory>/scripts/kick-off {{issue}} <slug>.
     Beep writes spec.md, tasks.md, and design.md only when the approach
     is risky. Beep writes no product code.
  2. Buzz implements the tasks in this worktree. Buzz does not write
     verify.md, does not edit tests to make them pass, and does not merge.
     If the change touches auth, billing, payments, data deletion, or
     migrations, stop and wait for James. Run <factory>/scripts/guardrails.
     Exit 2 means stop. When Buzz starts, post
     <factory>/scripts/intake status in_progress --issue {{issue}}.
  3. Blip owns tests. Read <factory>/agents/blip/ROLE.md. tasks.md includes
     the tests. Blip writes or extends unit, integration, and, on a web
     app, end-to-end tests. Run <factory>/scripts/fix-loop. It runs
     scripts/orca-verify. A missing test command fails. Exit 0 means
     green: continue to Echo. Exit 3 means red, and a fix round remains:
     do not stop the run. Buzz fixes product code. Blip fixes the test
     when the test itself is wrong. Then Blip runs fix-loop again. The
     writer does not certify the fix. Exit 2 means fix_rounds is spent
     (default 2, set in orca.project.yaml): escalate to James with the
     script's summary. Do not open a pull request and do not merge.
     Nothing merges while tests are red.
  4. Echo verifies in a fresh session, read-only on product code. Echo runs
     <factory>/scripts/verify. The only verdict that continues is Ready to ship,
     and only when the suite is green. If Echo's run of orca-verify is red,
     go back to step 3. Do not end the run. Any other not-ready verdict
     stops before a pull request.
  5. Open a pull request against develop and comment on the issue. Use the
     repository pull request template, including the primitives recap.
     Link the pull request with
     <factory>/scripts/intake link-pr <pr-url> --issue {{issue}}.
     Do not mark the ticket done until it has merged.
  6. Bloops merges with <factory>/scripts/merge-pr. scripts/ship-pr is the
     same script. High risk waits for James. Never main. Do not turn on
     GitHub auto-merge. After a merge, post
     <factory>/scripts/intake status done --issue {{issue}}.
     Then run <factory>/scripts/bloops-reflect. Proposals
     are issues or pull requests. Do not edit skills in place.
  7. File leftover papercuts as GitHub issues labeled friction. Search open
     friction issues first.

  While you work, use the four habits: explore-first, delegate-cheap-work,
  verify-before-ship, decompose-hotspot. The copies in
  docs/reference/context-pack-2026-11-11 are reference, not the runtime.
  The short form is on the primitives page in the factory.

  An issue labelled bleeps:found was filed by Chip. Use the same steps.
  If the issue body says Risk: high, it touches a guardrail. Wait for James
  and do not merge.

  The provider and model for each role are the providers table below.
  Orca drops that key. Run <factory>/scripts/providers show <role> and
  launch with the flags it prints. A project overrides one field in
  orca.project.yaml. router defaults to off. router: jev asks a local
  Jev proxy and is optional. Beep and Echo stay on the frontier model.
  Buzz and Chip stay on their floor unless the proxy names a higher tier.
  Blip stays on the balanced model until a fix round has failed, then
  run show blip --stalled. A guardrail (scripts/guardrails exit 2) uses
  the frontier model: pass --guardrail. If the proxy does not answer,
  use the role's configured model. Bloops merges with scripts/merge-pr
  and uses no model for that. Reflection is show bloops.

  Where the factory runs is the host key in orca.project.yaml. local is the
  default: the computer in front of you, and only while it is on and Orca is
  running. cloud is a VPS you leave on. home is a machine at home. Register
  Chip's automation on that machine. A GitHub Actions job can run checks. It
  cannot run this command.

  Ticket sources are set in orca.project.yaml (ticket_sources). GitHub is
  required on every project: code, pull requests, and CI live there. Jira,
  Discord, Linear, and a GitHub Project are optional. A ticket from one of
  those is mirrored to a GitHub issue so this command can run. Chip files
  bleeps:found on GitHub, and also posts the finding to each other source
  the project configured. Run scripts/check-ticket-sources on the machine
  that will do the work. It fails when GitHub access is missing.

  CodeRabbit, Devin, and the architecture-fit review are not started by
  this file. Do not claim a review ran unless it did. Grok Bot is not
  running. James promotes develop to main.

worktree:
  # Orca shares these across worktrees of the same repo when the directory
  # exists and is gitignored. A missing path is skipped. It does not fail
  # worktree creation. A project that must not share them copies this file
  # instead of symlinking it.
  sharedDirectories:
    - node_modules
    - site/node_modules

# Bleeps reads this. Orca's parser drops it. Defaults match scripts/providers.
providers:
  router: off
  roles:
    beep:
      provider: claude
      model: opus
      tier: frontier
      route: fixed
    buzz:
      provider: claude
      model: sonnet
      tier: balanced
      route: jev
    blip:
      provider: claude
      model: sonnet
      tier: balanced
      route: stall
    echo:
      provider: claude
      model: opus
      tier: frontier
      route: fixed
    chip:
      provider: claude
      model: haiku
      tier: fast
      route: jev
    bloops:
      provider: claude
      model: sonnet
      tier: balanced
      route: reflect
